<div class="card login-card" style="margin-top: 100px;">
    <div class="card-header text-center">
        <h2 class="card-title">Forgot Password</h2>
        <p class="card-subtitle">Enter your verified email address to receive a password reset link.</p>
    </div>

    <form id="forgotPasswordForm">
        <div class="form-group">
            <label class="form-label" for="forgotEmail">Email Address</label>
            <div class="input-wrapper">
                <input type="email" id="forgotEmail" class="form-input" placeholder="you@example.com" required
                    autocomplete="email">
                <span class="input-focus-border"></span>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="forgotSubmitBtn">
            Send Reset Link
        </button>
    </form>

    <div class="login-footer" style="margin-top: 20px;">
        Remember your password?
        <a href="#/login" class="link-primary" data-link>Login here</a>
    </div>
</div>
