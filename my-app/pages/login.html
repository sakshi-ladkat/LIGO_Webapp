<div class="card login-card">
    <div class="card-header text-center">
        <h2 class="card-title">Welcome Back</h2>
        <p class="card-subtitle">Sign in to your account to continue</p>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label class="form-label" for="loginEmail">Email Address</label>
            <div class="input-wrapper">
                <input type="email" id="loginEmail" class="form-input" placeholder="you@example.com" required
                    autocomplete="email">
                <span class="input-focus-border"></span>
            </div>
        </div>

        <div class="form-group">
            <div class="login-label-row">
                <label class="form-label" for="loginPassword">Password</label>
            </div>
            <div class="input-wrapper password-wrapper">
                <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required
                    autocomplete="current-password">
                <span class="input-focus-border"></span>
                <span class="toggle-password login-eye" id="loginEyeBtn" title="Show password"
                    onclick="toggleLoginPassword()"></span>
            </div>
            <a href="#/forgot-password" class="forgot-password-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="loginSubmitBtn">
            Sign In
        </button>

        <div id="loginMessage" class="login-msg"></div>
    </form>

    <div class="login-footer">
        Don't have an account?
        <a href="#/multi-step-register" class="link-primary" data-link>Create one</a>
    </div>
</div>
