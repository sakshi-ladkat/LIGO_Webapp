<div class="card login-card" style="max-width: 450px; margin: 0 auto;">
    <div class="card-header text-center">
        <!-- Optional: Lock Icon -->
        <div style="font-size: 40px; margin-bottom: 10px;">🔐</div>
        <h2 class="card-title">Set Your Password</h2>
        <p class="card-subtitle">Secure your account to get started</p>
    </div>

    <!-- Instructions -->
    <div class="alert alert-info"
        style="font-size: 13px; text-align: left; margin-bottom: 20px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px;">
        <strong>Password Requirements:</strong>
        <ul style="margin: 5px 0 0 20px; padding: 0; color: #64748b;">
            <li id="req-length">At least 8 characters</li>
            <li id="req-upper">One uppercase letter (A-Z)</li>
            <li id="req-number">One number (0-9)</li>
            <li id="req-special">One special character (!@#$...)</li>
        </ul>
    </div>

    <form id="setupPasswordForm">
        <!-- Hidden Token & Email -->
        <input type="hidden" id="token" name="token">
        <input type="hidden" id="email" name="email">

        <div class="form-group">
            <label class="form-label" for="password">New Password</label>
            <div class="input-wrapper">
                <input type="password" id="password" class="form-input" placeholder="Enter new password" required
                    autocomplete="new-password">
                <span class="input-focus-border"></span>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <div class="input-wrapper">
                <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm new password"
                    required autocomplete="new-password">
                <span class="input-focus-border"></span>
            </div>
            <div id="passwordMatchError" class="text-danger small mt-1" style="display:none;">Passwords do not match
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
            Set Password & Login
        </button>

        <div id="message" class="mt-md"></div>
    </form>
</div>
