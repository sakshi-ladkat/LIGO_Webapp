<!DOCTYPE html>
<html lang="en">

<head>
    <!-- =====================================================
         META CONFIGURATION
         ===================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBAC System</title>

    <!-- =====================================================
         FONTS
         ===================================================== -->
    <!-- Google Font: Inter (used throughout the UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- =====================================================
         STYLESHEETS
         ===================================================== -->
    <!-- Toastr notification styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">

    <!-- Design tokens & global variables -->
    <link rel="stylesheet" href="./assets/css/variables.css">

    <!-- Main application styles -->
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/pages/login.css">
    <link rel="stylesheet" href="./assets/css/pages/register.css">
    <link rel="stylesheet" href="./assets/css/components/header.css">
    <link rel="stylesheet" href="./assets/css/components/footer.css">

</head>

<body>
    <!-- =====================================================
         APPLICATION ROOT
         ===================================================== -->
    <div id="app">

        <!-- Header Component (loaded dynamically) -->
        <div id="app-header"></div>

        <!-- =====================================================
             MAIN CONTENT AREA (SPA ROUTER OUTLET)
             ===================================================== -->
        <main id="content">
            <!-- Initial loading state (shown while content loads) -->
            <div class="loading-screen">
                <div class="spinner"></div>
            </div>
        </main>

        <!-- Footer Component (loaded dynamically) -->
        <div id="app-footer"></div>
    </div>

    <!-- =====================================================
         TOAST NOTIFICATION CONTAINER
         ===================================================== -->
    <!-- Used for custom toast messages -->
    <div id="toast-container"></div>

    <!-- =====================================================
         SCRIPTS
         ===================================================== -->

    <!-- Core dependencies -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Toastr for toast notifications -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <!-- Toastr global configuration -->
    <script>
        toastr.options = {
            closeButton: true,         // Show close button
            progressBar: true,         // Show progress bar
            positionClass: "toast-top-right", // Position on screen
            timeOut: "5000"            // Auto close delay (ms)
        };
    </script>

    <!-- =====================================================
         APPLICATION MODULES (ORDER MATTERS)
         ===================================================== -->

    <!-- Global app configuration -->
    <script src="./assets/js/config.js"></script>

    <!-- Utility helper functions -->
    <script src="./assets/js/utils/utils.js"></script>

    <!-- Layout loader (header, footer, navigation) -->
    <script src="./assets/js/modules/layout.js"></script>

    <!-- Registration module initialization -->
    <script type="module" src="./assets/js/modules/registration.js"></script>

    <!-- Main application bootstrap & router -->
    <script src="./assets/js/modules/app.js"></script>

</body>

</html>
