version: '3.8'

services:
  frontend:
    build:
      context: ./my-app
      dockerfile: Dockerfile
    container_name: my-app-frontend
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    volumes:
      - ./my-app:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: my-app-backend
    ports:
      - "8000:8000"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=Project
      - DB_USERNAME=root
      - DB_PASSWORD=Sakshi@2003
      - REDIS_HOST=redis
    volumes:
      - ./Backend:/app
      - /app/vendor
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: my-app-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: Project
      MYSQL_ROOT_PASSWORD: Sakshi@2003
    volumes:
      - db-data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: my-app-redis
    ports:
      - "6379:6379"

volumes:
  db-data:
