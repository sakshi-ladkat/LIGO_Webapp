services:

  # ── Laravel Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ligo_backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      # Absolute path inside the container
      DB_DATABASE: OrbitAccess
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      CACHE_STORE: file
    volumes:
      # Persist the SQLite database across container restarts
      - backend_db:/var/www/backend/database
      # Persist Laravel storage (logs, cache, uploaded files)
      - backend_storage:/var/www/backend/storage
    networks:
      - ligo_net
    healthcheck:
      test: ["CMD", "php", "artisan", "tinker", "--execute=echo 'ok';"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Vite Frontend (Nginx) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: ligo_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ligo_net

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  backend_db:
  backend_storage:

# ── Network ──────────────────────────────────────────────────────────────────
networks:
  ligo_net:
    driver: bridge
